[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dr8sim"
version = "0.1.0"
description = "End-to-end 1.6T-DR8 (8x200G PAM4) optical link simulator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dr8sim = "dr8sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs sensitivity sweeps / full link budget (deselect with -m 'not slow')"]

[tool.ruff]
indent-width = 2
line-length = 80
